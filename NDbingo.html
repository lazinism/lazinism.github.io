<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nintendo Direct Bingo Maker</title>
    <style>
        body {
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            background-color: #f0f0f0;
        }

        #container {
            position: relative;
            margin-bottom: 20px;
        }

        #bingoCanvas {
            border: 1px solid #ccc;
        }

        #inputGrid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 5px;
            max-width: 800px;
            margin: 0 auto;
        }

        #inputGrid input {
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
            text-align: center;
        }

        button {
            padding: 10px 20px;
            background-color: #e60012; /* Nintendo Red */
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            margin-top: 10px;
        }

        button:hover {
            background-color: #b3000f;
        }
    </style>
</head>
<body>

<div id="container">
    <canvas id="bingoCanvas" width="800" height="900"></canvas>
</div>

<div id="inputGrid">
    </div>

<button id="updateButton">텍스트 적용</button>

<script>
    const canvas = document.getElementById('bingoCanvas');
    const ctx = canvas.getContext('2d');
    const inputGrid = document.getElementById('inputGrid');
    const updateButton = document.getElementById('updateButton');
    const img = new Image();

    const gridRows = 5;
    const gridCols = 5;
    const numCells = gridRows * gridCols;

    img.onload = () => {
        const aspect = img.width / img.height;
        canvas.width = 800; 
        canvas.height = canvas.width / aspect;
        
        createInputs();
        drawBingo();
    };

    img.src = 'etcs/bingo.png';

    function createInputs() {
        for (let i = 0; i < numCells; i++) {
            const input = document.createElement('input');
            input.type = 'text';
            input.id = `input-${i}`;
            input.placeholder = `칸 ${i + 1}`;
            input.addEventListener('input', drawBingo);
            inputGrid.appendChild(input);
        }
    }

    function wrapText(context, text, x, y, maxWidth, lineHeight) {
        const words = text.split(' ');
        let line = '';
        let numLines = 0;

        for (let n = 0; n < words.length; n++) {
            const testLine = line + words[n] + ' ';
            const metrics = context.measureText(testLine);
            const testWidth = metrics.width;
            if (testWidth > maxWidth && n > 0) {
                context.fillText(line, x, y);
                line = words[n] + ' ';
                y += lineHeight;
                numLines++;
            } else {
                line = testLine;
            }
        }
        context.fillText(line, x, y);
        numLines++;
        return numLines;
    }

function drawBingo() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);

        // [수정] 양끝 열의 간격을 바깥쪽으로 미세하게 넓힘
        const colStartXMultipliers = [0.014, 0.211, 0.409, 0.607, 0.805]; 
        
        // [수정] 박스 크기 미세 확대 및 Y축 시작점 영점 조절
        const startY = canvas.height * 0.186;  
        const boxWidth = canvas.width * 0.184; 
        const boxHeight = canvas.height * 0.146;
        const gapY = canvas.height * 0.015;    

        const bgAlpha = 0.6; 
        const textColor = '#FF0000'; 
        const fontSize = 18; 
        const lineHeight = 22; 

        for (let r = 0; r < gridRows; r++) {
            for (let c = 0; c < gridCols; c++) {
                const i = r * gridCols + c;
                const text = document.getElementById(`input-${i}`).value;

                if (text) {
                    const x = canvas.width * colStartXMultipliers[c];
                    const y = startY + r * (boxHeight + gapY);

                    ctx.fillStyle = `rgba(255, 255, 255, ${bgAlpha})`;
                    // [수정] 안쪽 여백(padding)을 줄여 틈새 최소화 (8 -> 5)
                    const padding = 5; 
                    ctx.fillRect(x + padding, y + padding, boxWidth - (padding * 2), boxHeight - (padding * 2));

                    ctx.fillStyle = textColor;
                    ctx.font = `bold ${fontSize}px sans-serif`;
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';

                    const textX = x + boxWidth / 2;
                    const textY = y + boxHeight / 2;
                    const maxWidth = boxWidth * 0.9; 

                    const linesToCalculateHeight = text.split(' ').length;
                    const estimatedTextHeight = linesToCalculateHeight * lineHeight;
                    const startingY = textY - estimatedTextHeight / 2 + lineHeight / 2; 

                    wrapText(ctx, text, textX, startingY, maxWidth, lineHeight);
                }
            }
        }
    }

    updateButton.addEventListener('click', drawBingo);
</script>

</body>
</html>
