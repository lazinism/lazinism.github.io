<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nintendo Direct Bingo Maker</title>
    <style>
        body {
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            background-color: #f0f0f0;
        }

        #container {
            position: relative;
            margin-bottom: 20px;
        }

        #bingoCanvas {
            border: 1px solid #ccc;
        }

        #inputGrid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 5px;
            max-width: 800px;
            margin: 0 auto;
        }

        #inputGrid input {
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
            text-align: center;
        }

        button {
            padding: 10px 20px;
            background-color: #e60012; /* Nintendo Red */
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            margin-top: 10px;
        }

        button:hover {
            background-color: #b3000f;
        }
    </style>
</head>
<body>

<div id="container">
    <canvas id="bingoCanvas" width="800" height="900"></canvas>
</div>

<div id="inputGrid">
    </div>

    const canvas = document.getElementById('bingoCanvas');
    const ctx = canvas.getContext('2d');
    const inputGrid = document.getElementById('inputGrid');
    const updateButton = document.getElementById('updateButton');
    const img = new Image();

    // 5x5 그리드 구성 정보
    const gridRows = 5;
    const gridCols = 5;
    const numCells = gridRows * gridCols;

    // 캔버스 크기와 일치하도록 원본 이미지 크기를 조정할 필요가 있을 수 있습니다.
    // 여기서는 캔버스 크기를 이미지 비율에 맞춥니다.
    img.onload = () => {
        const aspect = img.width / img.height;
        canvas.width = 800; // 원하는 너비
        canvas.height = canvas.width / aspect;
        
        createInputs();
        drawBingo();
    };
    img.src = base64Image;

    // 25개의 입력 필드를 생성하여 그리드에 추가
    function createInputs() {
        for (let i = 0; i < numCells; i++) {
            const input = document.createElement('input');
            input.type = 'text';
            input.id = `input-${i}`;
            input.placeholder = `칸 ${i + 1}`;
            input.addEventListener('input', drawBingo); // 실시간 업데이트를 위해 입력 시마다 그리기
            inputGrid.appendChild(input);
        }
    }

    // 텍스트를 자동 줄바꿈하여 그리는 함수
    function wrapText(context, text, x, y, maxWidth, lineHeight) {
        const words = text.split(' ');
        let line = '';
        let numLines = 0;

        for (let n = 0; n < words.length; n++) {
            const testLine = line + words[n] + ' ';
            const metrics = context.measureText(testLine);
            const testWidth = metrics.width;
            if (testWidth > maxWidth && n > 0) {
                context.fillText(line, x, y);
                line = words[n] + ' ';
                y += lineHeight;
                numLines++;
            } else {
                line = testLine;
            }
        }
        context.fillText(line, x, y);
        numLines++;
        return numLines;
    }

    // 캔버스에 빙고판과 텍스트 그리기
    function drawBingo() {
        // 캔버스 초기화 및 배경 이미지 그리기
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);

        // 원본 이미지의 그리드 비율을 고려하여 칸 크기 계산
        // Nintendo Direct 로고 영역을 제외하고 그리드 영역을 추정
        const gridAreaStartPercent = 14; // 로고 아래 시작점 (예시, 원본 이미지에 맞춰 조정)
        const cellStartWidthPercent = 2.5; // 좌측 여백 시작점
        const gridAreaWidthPercent = 95; // 전체 그리드 영역 너비 비율
        const gridAreaHeightPercent = 84; // 전체 그리드 영역 높이 비율

        const gridX = canvas.width * (cellStartWidthPercent / 100);
        const gridY = canvas.height * (gridAreaStartPercent / 100);
        const gridWidth = canvas.width * (gridAreaWidthPercent / 100);
        const gridHeight = canvas.height * (gridAreaHeightPercent / 100);

        const cellWidth = gridWidth / gridCols;
        const cellHeight = gridHeight / gridRows;

        // 반투명 배경 및 텍스트 설정
        const bgAlpha = 0.6; // 0.0 (투명) ~ 1.0 (불투명)
        const textColor = '#FF0000'; // 텍스트 색상
        const fontSize = 18; // 폰트 크기
        const lineHeight = 22; // 줄 간격
        const maxWidthPaddingPercent = 10; // 칸 너비의 10%를 좌우 여백으로 사용

        for (let r = 0; r < gridRows; r++) {
            for (let c = 0; c < gridCols; c++) {
                const i = r * gridCols + c;
                const text = document.getElementById(`input-${i}`).value;

                if (text) {
                    const x = gridX + c * cellWidth;
                    const y = gridY + r * cellHeight;

                    // 1. 반투명 배경 그리기
                    ctx.fillStyle = `rgba(255, 255, 255, ${bgAlpha})`;
                    // 원본 사각형 테두리 안에 깔끔하게 들어가도록 약간 줄여서 그리기
                    const cellPadding = 2; 
                    ctx.fillRect(x + cellPadding, y + cellPadding, cellWidth - 2 * cellPadding, cellHeight - 2 * cellPadding);

                    // 2. 텍스트 그리기
                    ctx.fillStyle = textColor;
                    ctx.font = `bold ${fontSize}px sans-serif`;
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';

                    const textX = x + cellWidth / 2;
                    const textY = y + cellHeight / 2;
                    const maxWidth = cellWidth * (1 - 2 * (maxWidthPaddingPercent / 100));

                    // 텍스트를 중앙에 배치하기 위해 wrapText가 반환한 줄 수를 활용하여 Y 시작점을 조정
                    const linesToCalculateHeight = text.split(' ').length; // 줄 수 추정용
                    const estimatedTextHeight = linesToCalculateHeight * lineHeight;
                    const startingY = textY - estimatedTextHeight / 2 + lineHeight / 2; // 줄 바꿈 함수 내에서 첫 줄 그릴 Y축 조정

                    // `wrapText` 함수가 줄 수를 반환하도록 수정하고 이를 활용하여 Y 정렬을 더욱 정교하게 할 수 있습니다. 
                    // 여기서는 간단하게 줄 수에 따라 시작 y를 대략적으로 조정합니다.
                    wrapText(ctx, text, textX, startingY, maxWidth, lineHeight);
                }
            }
        }
    }

    updateButton.addEventListener('click', drawBingo);

    // 사용자가 입력할 때마다 실시간 업데이트를 위해 createInputs() 내에 이벤트 리스너를 이미 추가했습니다.
</script>
